kind = "api"
previewPath = "/api"
title = "Scientific Discovery Backend"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["uv", "run", "python", "-m", "compileall", "-q", "artifacts/api-server/app"]

[services.production.build.env]
ENVIRONMENT = "production"

[services.production.run]
args = ["uv", "run", "--directory", "artifacts/api-server", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
ENVIRONMENT = "production"

[services.production.health.startup]
path = "/api/healthz"